  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;

#popup {

.popup-backdrop {

.popup-icon-wrap {

.popup-icon-circle {

.popup-btn:active {

@keyframes popup-fade-up {

<script>
  
// ================================
// INITIAL SETUP
// ================================

const form = document.getElementById("bookingForm");
const submitBtn = document.getElementById("submitBtn");

// ================================
// UTIL FUNCTIONS
// ================================

// Close popup
function closePopup() {
  document.getElementById("popup").style.display = "none";
}

// Generate Booking ID
function generateBookingID() {
  const now = new Date();
  const year = now.getFullYear();
  const random = Math.floor(1000 + Math.random() * 9000);
  return `GEM-${year}-${random}`;
}

// 1-hour validation
function isAtLeastOneHourFromNow(preferredDate, preferredTime) {
  if (!preferredDate || !preferredTime) return false;

  const appointment = new Date(`${preferredDate}T${preferredTime}`);
  const now = new Date();

  if (isNaN(appointment.getTime())) return false;

  return (appointment - now) >= 60 * 60 * 1000;
}

// Disable past dates
function disablePastDates() {
  const dateInput = document.querySelector("input[name='preferred_date']");
  if (!dateInput) return;

  const today = new Date().toISOString().split("T")[0];
  dateInput.min = today;
}

// Set minimum time if today selected
function setMinimumTime() {
  const timeInput = document.getElementById("preferredTime");
  const dateInput = document.querySelector("input[name='preferred_date']");
  if (!timeInput || !dateInput) return;

  const selectedDate = dateInput.value;
  if (!selectedDate) {
    timeInput.min = "00:00";
    return;
  }

  const now = new Date();
  const selected = new Date(selectedDate + "T00:00:00");

  timeInput.min = "00:00";

  if (selected.toDateString() === now.toDateString()) {
    now.setHours(now.getHours() + 1);

    const hours = now.getHours().toString().padStart(2, "0");
    const minutes = now.getMinutes().toString().padStart(2, "0");

    timeInput.min = `${hours}:${minutes}`;
  }
}

// Compute age
function computeAge() {
  const birthdateInput = document.querySelector("input[name='birthdate']");
  const ageField = document.getElementById("ageField");

  if (!birthdateInput.value) {
    ageField.value = "";
    return;
  }

  const today = new Date();
  const birthDate = new Date(birthdateInput.value);

  let age = today.getFullYear() - birthDate.getFullYear();
  const monthDiff = today.getMonth() - birthDate.getMonth();

  if (
    monthDiff < 0 ||
    (monthDiff === 0 && today.getDate() < birthDate.getDate())
  ) {
    age--;
  }

  ageField.value = age;
}

// Payment details display
function showPaymentDetails() {
  const method = document.getElementById("payment_method").value;
  const detailsBox = document.getElementById("paymentDetails");

  if (method === "Maribank/Seabank PH") {
    detailsBox.style.display = "block";
    detailsBox.innerHTML = `
      <strong>Maribank / Seabank PH Details:</strong><br><br>
      Account Name: GemCare Medical Clinic/Mardy P.<br>
      Account Number: 1018 8612 326<br>
      Please send your proof of payment after transfer.
    `;
  } else if (method === "PayMaya Wallet PH") {
    detailsBox.style.display = "block";
    detailsBox.innerHTML = `
      <strong>PayMaya Wallet PH Details:</strong><br><br>
      Account Name: GemCare Medical Clinic/Mardy P.<br>
      Mobile Number: 0938 550 1147<br>
      Kindly screenshot your payment confirmation.
    `;
    
  } else {
    detailsBox.style.display = "none";
    detailsBox.innerHTML = "";
  }
}

// ================================
// PAGE LOAD SETUP
// ================================

window.addEventListener("load", function () {
  disablePastDates();
  setMinimumTime();

  const birthdateInput = document.querySelector("input[name='birthdate']");
  const today = new Date().toISOString().split("T")[0];

  birthdateInput.max = today;
  birthdateInput.addEventListener("change", computeAge);

  const dateInput = document.querySelector("input[name='preferred_date']");
  dateInput.addEventListener("change", setMinimumTime);
});

// ================================
// MAIN SUBMIT HANDLER
// ================================

form.addEventListener("submit", async function (event) {
  event.preventDefault();

  submitBtn.disabled = true;
  submitBtn.textContent = "Processing...";

  try {

    // 1️⃣ 1-hour validation
    if (!isAtLeastOneHourFromNow(
      form.preferred_date.value,
      form.preferred_time.value
    )) {
      alert("Booking must be at least 1 hour from now.");
      return;
    }

    const bookingID = generateBookingID();

    // 2️⃣ File validation
    const fileInput = document.getElementById("proofUpload");
    if (!fileInput.files.length) {
      alert("Please upload proof of payment.");
      return;
    }

    const file = fileInput.files[0];
    const fileName = `${bookingID}-${Date.now()}`;

    // 3️⃣ Upload to Supabase Storage
const { error: uploadError } = await supabaseClient
  .storage
  .from("proofs")
  .upload(fileName, file, { upsert: false });

if (uploadError) throw uploadError;

// Get public URL
const { data: publicUrlData } = supabaseClient
  .storage
  .from("proofs")
  .getPublicUrl(fileName);

if (!publicUrlData?.publicUrl) {
  throw new Error("Failed to generate public URL.");
}

const proofURL = publicUrlData.publicUrl;
    console.log("PROOF URL:", proofURL);
    // 4️⃣ Insert to Database
    const { error: insertError } = await supabaseClient
      .from("booking")
      .insert([{
        booking_id: bookingID,
        fullname: form.fullname.value,
        address: form.address.value,
        birthdate: form.birthdate.value,
        age: form.age.value,
        sex: form.sex.value,
        email: form.email.value,
        nationality: form.nationality.value,
        purpose: form.purpose.value,
        chief_complaint: form.chief_complaint.value,
        category: form.category.value,
        preferred_date: form.preferred_date.value,
        preferred_time: form.preferred_time.value,
        payment_method: form.payment_method.value,
        reference_number: form.reference_number.value,
        proof_of_payment: proofURL,
        status: "pending"
      }]);

    if (insertError) throw insertError;
    
    // 6️⃣ Send Email
    await emailjs.send(
  "service_wxmrawk",
  "template_bsoh23l",
  {
    booking_id: bookingID,
    fullname: form.fullname.value,
    email: form.email.value,
    address: form.address.value,
    birthdate: form.birthdate.value,
    age: form.age.value,
    sex: form.sex.value,
    nationality: form.nationality.value,
    purpose: form.purpose.value,
    chief_complaint: form.chief_complaint.value,
    category: form.category.value,
    preferred_date: form.preferred_date.value,
    preferred_time: form.preferred_time.value,
    payment_method: form.payment_method.value,
    reference_number: form.reference_number.value,
    proof_of_payment: proofURL,
    status: "Pending"
  }
);
    // 7️⃣ Success popup
    document.getElementById("popupMessage").innerHTML = `
      Your Booking ID is <strong>${bookingID}</strong><br><br>
      We’ve received your appointment request.
    `;
    document.getElementById("popup").style.display = "flex";

    form.reset();

  } catch (err) {
  console.error("FULL ERROR:", err);
  alert("Error: " + (err?.message || JSON.stringify(err)));
} finally {
  submitBtn.disabled = false;
  submitBtn.textContent = "Submit Appointment";
}
});

  // ================================
// LANDING VIDEO ROTATION
// ================================

window.addEventListener("DOMContentLoaded", function () {

  const videos = document.querySelectorAll(".bg-video");
  if (!videos.length) return;

  let current = 0;
  let interval;

  function startRotation() {

  videos.forEach(v => {
    v.pause();
    v.currentTime = 0;
    v.classList.remove("active");
  });

  videos[current].classList.add("active");
  videos[current].play();

  interval = setInterval(() => {

    videos[current].pause();
    videos[current].currentTime = 0;
    videos[current].classList.remove("active");

    current = (current + 1) % videos.length;

    videos[current].classList.add("active");
    videos[current].play();

  }, 5000);

}

  startRotation();

  window.startBooking = function () {

  clearInterval(interval);

  document.getElementById("landingPage").style.display = "none";
  document.getElementById("bookingPage").style.display = "block";

};

}); // ← THIS closes DOMContentLoaded
</script>
